<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#DCEFEA"/>
      <stop offset="1" stop-color="#EEF2F8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#1B2A4A" flood-opacity="0.16"/>
    </filter>
    <style>
      .muted { fill: #5B6B85; }
      .task { fill: #F8FAFC; stroke: #E4EAF2; stroke-width: 1.5; }
      .t { font-size: 17px; fill: #1B2A4A; }
      .done { font-size: 17px; fill: #9AA7BD; text-decoration: line-through; }
      .trash { fill: none; stroke: #B5C0D0; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>

  <!-- Browser chrome -->
  <rect width="1280" height="800" fill="url(#bg)"/>
  <rect width="1280" height="56" fill="#E6EBF2"/>
  <circle cx="28" cy="28" r="7" fill="#EF6B5E"/><circle cx="50" cy="28" r="7" fill="#F2B544"/><circle cx="72" cy="28" r="7" fill="#2F9E6E"/>
  <rect x="340" y="14" width="600" height="28" rx="14" fill="#fff"/>
  <text x="640" y="33" font-size="14" text-anchor="middle" class="muted">ayesha-bashir.github.io/todo-app</text>
  <line x1="0" y1="56" x2="1280" y2="56" stroke="#D9E0EA"/>

  <!-- Decorative circles -->
  <circle cx="190" cy="660" r="120" fill="#2F7D6D" opacity="0.08"/>
  <circle cx="1120" cy="200" r="90" fill="#F2B544" opacity="0.18"/>

  <!-- App card -->
  <rect x="390" y="110" width="500" height="650" rx="22" fill="#fff" filter="url(#shadow)"/>

  <text x="430" y="178" font-size="36" font-weight="700" fill="#1B2A4A">My Tasks</text>
  <text x="430" y="206" font-size="16" class="muted">Tuesday, 29 September</text>

  <!-- Progress ring 2/5 -->
  <circle cx="820" cy="178" r="28" fill="none" stroke="#E4EAF2" stroke-width="7"/>
  <circle cx="820" cy="178" r="28" fill="none" stroke="#2F7D6D" stroke-width="7" stroke-linecap="round"
          stroke-dasharray="70.4 176" transform="rotate(-90 820 178)"/>
  <text x="820" y="184" font-size="15" font-weight="700" text-anchor="middle" fill="#1B2A4A">2/5</text>

  <!-- Input + Add button -->
  <rect x="430" y="236" width="322" height="54" rx="12" fill="#F3F6FA" stroke="#D9E0EA" stroke-width="1.5"/>
  <text x="452" y="269" font-size="16" fill="#9AA7BD">Add a new task…</text>
  <rect x="764" y="236" width="86" height="54" rx="12" fill="#2F7D6D"/>
  <text x="807" y="269" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">+ Add</text>

  <!-- Filter tabs -->
  <rect x="430" y="314" width="58" height="32" rx="16" fill="#1B2A4A"/>
  <text x="459" y="335" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">All</text>
  <text x="530" y="335" font-size="14" font-weight="700" text-anchor="middle" class="muted">Active</text>
  <text x="600" y="335" font-size="14" font-weight="700" text-anchor="middle" class="muted">Done</text>

  <!-- Task 1 (done) -->
  <rect x="430" y="370" width="420" height="56" rx="12" class="task"/>
  <circle cx="460" cy="398" r="11" fill="#2F7D6D"/>
  <path d="M455 398l4 4 7-8" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="484" y="404" class="done">Finish portfolio hero section</text>
  <path class="trash" d="M814 392h16M818 392v-3h8v3M816 392l1 14h10l1-14"/>

  <!-- Task 2 (done) -->
  <rect x="430" y="436" width="420" height="56" rx="12" class="task"/>
  <circle cx="460" cy="464" r="11" fill="#2F7D6D"/>
  <path d="M455 464l4 4 7-8" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="484" y="470" class="done">Clean sales data in Excel</text>
  <path class="trash" d="M814 458h16M818 458v-3h8v3M816 458l1 14h10l1-14"/>

  <!-- Task 3 -->
  <rect x="430" y="502" width="420" height="56" rx="12" class="task"/>
  <circle cx="460" cy="530" r="10" fill="#fff" stroke="#B5C0D0" stroke-width="2"/>
  <text x="484" y="536" class="t">Practise JavaScript arrays</text>
  <rect x="728" y="518" width="50" height="24" rx="12" fill="#2F7D6D" opacity="0.12"/>
  <text x="753" y="535" font-size="12" font-weight="700" fill="#2F7D6D" text-anchor="middle">Web</text>
  <path class="trash" d="M814 524h16M818 524v-3h8v3M816 524l1 14h10l1-14"/>

  <!-- Task 4 -->
  <rect x="430" y="568" width="420" height="56" rx="12" class="task"/>
  <circle cx="460" cy="596" r="10" fill="#fff" stroke="#B5C0D0" stroke-width="2"/>
  <text x="484" y="602" class="t">Build Power BI sales report</text>
  <rect x="728" y="584" width="50" height="24" rx="12" fill="#F2B544" opacity="0.25"/>
  <text x="753" y="601" font-size="12" font-weight="700" fill="#A8740F" text-anchor="middle">Data</text>
  <path class="trash" d="M814 590h16M818 590v-3h8v3M816 590l1 14h10l1-14"/>

  <!-- Task 5 -->
  <rect x="430" y="634" width="420" height="56" rx="12" class="task"/>
  <circle cx="460" cy="662" r="10" fill="#fff" stroke="#B5C0D0" stroke-width="2"/>
  <text x="484" y="668" class="t">Push calculator to GitHub</text>
  <rect x="728" y="650" width="50" height="24" rx="12" fill="#2F7D6D" opacity="0.12"/>
  <text x="753" y="667" font-size="12" font-weight="700" fill="#2F7D6D" text-anchor="middle">Web</text>
  <path class="trash" d="M814 656h16M818 656v-3h8v3M816 656l1 14h10l1-14"/>

  <!-- Footer -->
  <line x1="430" y1="710" x2="850" y2="710" stroke="#E4EAF2" stroke-width="1.5"/>
  <text x="430" y="740" font-size="15" class="muted">3 tasks left</text>
  <text x="850" y="740" font-size="15" font-weight="700" fill="#2F7D6D" text-anchor="end">Clear completed</text>

  <!-- Saved toast -->
  <rect x="930" y="660" width="250" height="56" rx="14" fill="#1B2A4A"/>
  <circle cx="962" cy="688" r="12" fill="#2F7D6D"/>
  <path d="M956 688l4 4 8-8" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="986" y="694" font-size="15" fill="#fff">Saved to localStorage</text>
</svg>
