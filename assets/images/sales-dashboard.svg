  <text x="272" y="160" class="lbl">Total revenue</text>
  <text x="272" y="198" class="kpi">PKR 3.1M</text>
  <text x="272" y="218" class="up">▲ 12.4% vs 2024</text>

  <rect x="505" y="130" width="235" height="100" rx="14" class="card" filter="url(#shadow)"/>
  <rect x="505" y="130" width="5" height="100" rx="2" fill="#F2B544"/>
  <text x="527" y="160" class="lbl">Orders</text>
  <text x="527" y="198" class="kpi">6,240</text>
  <text x="527" y="218" class="up">▲ 8.1% vs 2024</text>

  <rect x="760" y="130" width="235" height="100" rx="14" class="card" filter="url(#shadow)"/>
