    <text x="472" y="540">Apr</text><text x="519" y="540">May</text><text x="566" y="540">Jun</text>
    <text x="613" y="540">Jul</text><text x="660" y="540">Aug</text><text x="707" y="540">Sep</text>
    <text x="754" y="540">Oct</text><text x="801" y="540">Nov</text><text x="848" y="540">Dec</text>
  </g>

  <!-- Tooltip on December -->
