  <text x="782" y="198" class="kpi">PKR 497</text>
  <text x="782" y="218" class="up">▲ 3.9% vs 2024</text>

  <rect x="1015" y="130" width="235" height="100" rx="14" class="card" filter="url(#shadow)"/>
  <rect x="1015" y="130" width="5" height="100" rx="2" fill="#9AA7BD"/>
