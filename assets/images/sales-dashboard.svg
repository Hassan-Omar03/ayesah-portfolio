  <text x="868" y="282" font-size="12" text-anchor="end" class="muted">PKR, thousands</text>

  <line x1="310" y1="520" x2="868" y2="520" stroke="#D9E0EA" stroke-width="1.5"/>
  <line x1="310" y1="470.5" x2="868" y2="470.5" class="grid"/>
  <line x1="310" y1="421" x2="868" y2="421" class="grid"/>
  <line x1="310" y1="371.5" x2="868" y2="371.5" class="grid"/>
  <line x1="310" y1="322" x2="868" y2="322" class="grid"/>
  <text x="300" y="524" class="ax" text-anchor="end">0</text>
  <text x="300" y="474" class="ax" text-anchor="end">90</text>
  <text x="300" y="425" class="ax" text-anchor="end">180</text>
  <text x="300" y="375" class="ax" text-anchor="end">270</text>
  <text x="300" y="326" class="ax" text-anchor="end">360</text>

