    <rect x="316" y="421" width="30" height="99" rx="5"/>
    <rect x="363" y="432" width="30" height="88" rx="5"/>
    <rect x="410" y="404.5" width="30" height="115.5" rx="5"/>
    <rect x="457" y="393.5" width="30" height="126.5" rx="5"/>
    <rect x="504" y="410" width="30" height="110" rx="5"/>
    <rect x="551" y="377" width="30" height="143" rx="5"/>
    <rect x="598" y="366" width="30" height="154" rx="5"/>
    <rect x="645" y="382.5" width="30" height="137.5" rx="5"/>
    <rect x="692" y="355" width="30" height="165" rx="5"/>
    <rect x="739" y="344" width="30" height="176" rx="5"/>
    <rect x="786" y="360.5" width="30" height="159.5" rx="5"/>
