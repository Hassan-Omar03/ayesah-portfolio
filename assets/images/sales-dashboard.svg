<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#1B2A4A" flood-opacity="0.08"/>
    </filter>
    <linearGradient id="barG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4FA592"/>
      <stop offset="1" stop-color="#2F7D6D"/>
    </linearGradient>
    <style>
      .card { fill: #fff; stroke: #E4EAF2; stroke-width: 1.5; }
      .muted { fill: #5B6B85; }
      .lbl { font-size: 13px; fill: #5B6B85; }
      .kpi { font-size: 30px; font-weight: 800; fill: #1B2A4A; }
      .up { font-size: 13px; font-weight: 700; fill: #22A06B; }
      .grid { stroke: #EEF2F7; stroke-width: 1.5; }
      .ax { font-size: 12px; fill: #9AA7BD; }
      .h { font-size: 17px; font-weight: 700; fill: #1B2A4A; }
      .side { font-size: 15px; fill: #9AA7BD; }
      .td { font-size: 14px; fill: #1B2A4A; }
    </style>
  </defs>

  <!-- Browser chrome -->
  <rect width="1280" height="800" fill="#F3F6FA"/>
  <rect width="1280" height="56" fill="#E6EBF2"/>
  <circle cx="28" cy="28" r="7" fill="#EF6B5E"/><circle cx="50" cy="28" r="7" fill="#F2B544"/><circle cx="72" cy="28" r="7" fill="#2F9E6E"/>
  <rect x="340" y="14" width="600" height="28" rx="14" fill="#fff"/>
  <text x="640" y="33" font-size="14" text-anchor="middle" fill="#5B6B85">app.powerbi.com · Store Sales 2025</text>

  <!-- Sidebar -->
  <rect x="0" y="56" width="220" height="744" fill="#1B2A4A"/>
  <rect x="24" y="84" width="34" height="34" rx="9" fill="#F2B544"/>
  <path d="M32 110v-8M41 110v-14M50 110v-5" stroke="#1B2A4A" stroke-width="3" stroke-linecap="round"/>
  <text x="70" y="108" font-size="19" font-weight="800" fill="#fff">SalesView</text>
  <rect x="14" y="146" width="192" height="42" rx="10" fill="#2F7D6D"/>
  <text x="34" y="173" font-size="15" font-weight="700" fill="#fff">Overview</text>
  <text x="34" y="225" class="side">Products</text>
  <text x="34" y="267" class="side">Stores</text>
  <text x="34" y="309" class="side">Customers</text>
  <text x="34" y="351" class="side">Data sources</text>
  <rect x="14" y="690" width="192" height="80" rx="12" fill="#243457"/>
  <text x="30" y="720" font-size="13" fill="#9AA7BD">Last refresh</text>
  <text x="30" y="746" font-size="15" font-weight="700" fill="#fff">28 Sep 2026, 9:14</text>

  <!-- Header -->
  <text x="250" y="102" font-size="26" font-weight="800" fill="#1B2A4A">Sales Overview · 2025</text>
  <rect x="990" y="78" width="130" height="34" rx="17" fill="#fff" stroke="#D9E0EA"/>
  <text x="1055" y="100" font-size="13" font-weight="700" text-anchor="middle" fill="#1B2A4A">Jan – Dec 2025</text>
  <rect x="1130" y="78" width="120" height="34" rx="17" fill="#fff" stroke="#D9E0EA"/>
  <text x="1190" y="100" font-size="13" font-weight="700" text-anchor="middle" fill="#1B2A4A">All stores ▾</text>

  <!-- KPI cards -->
