  <line x1="272" y1="658" x2="1228" y2="658" stroke="#E4EAF2" stroke-width="1.5"/>

  <text x="272" y="686" class="td" font-weight="700">Chocolate croissant</text>
  <rect x="560" y="672" width="64" height="22" rx="11" fill="#2F7D6D" opacity="0.12"/><text x="592" y="687" font-size="12" font-weight="700" fill="#2F7D6D" text-anchor="middle">Bakery</text>
  <text x="760" y="686" class="td">1,842</text><text x="900" y="686" class="td">PKR 552K</text>
  <polyline points="1060,690 1080,684 1100,686 1120,676 1140,678 1160,668" fill="none" stroke="#22A06B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

  <line x1="272" y1="704" x2="1228" y2="704" stroke="#EEF2F7" stroke-width="1.5"/>
  <text x="272" y="731" class="td" font-weight="700">Iced caramel latte</text>
  <rect x="560" y="717" width="64" height="22" rx="11" fill="#F2B544" opacity="0.25"/><text x="592" y="732" font-size="12" font-weight="700" fill="#A8740F" text-anchor="middle">Drinks</text>
  <text x="760" y="731" class="td">1,315</text><text x="900" y="731" class="td">PKR 460K</text>
  <polyline points="1060,736 1080,730 1100,732 1120,722 1140,716 1160,712" fill="none" stroke="#22A06B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

  <line x1="272" y1="749" x2="1228" y2="749" stroke="#EEF2F7" stroke-width="1.5"/>
  <text x="272" y="772" class="td" font-weight="700">Sourdough loaf</text>
  <rect x="560" y="758" width="64" height="22" rx="11" fill="#2F7D6D" opacity="0.12"/><text x="592" y="773" font-size="12" font-weight="700" fill="#2F7D6D" text-anchor="middle">Bakery</text>
  <text x="760" y="772" class="td">968</text><text x="900" y="772" class="td">PKR 387K</text>
  <polyline points="1060,766 1080,770 1100,764 1120,768 1140,762 1160,764" fill="none" stroke="#5B6B85" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
