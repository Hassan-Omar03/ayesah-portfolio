  <rect x="910" y="250" width="340" height="310" rx="14" class="card" filter="url(#shadow)"/>
  <text x="932" y="282" class="h">Sales by category</text>

  <g transform="rotate(-90 1010 420)" fill="none" stroke-width="28">
    <circle cx="1010" cy="420" r="70" stroke="#2F7D6D" stroke-dasharray="167 440"/>
    <circle cx="1010" cy="420" r="70" stroke="#F2B544" stroke-dasharray="119 440" stroke-dashoffset="-167"/>
    <circle cx="1010" cy="420" r="70" stroke="#1B2A4A" stroke-dasharray="88 440" stroke-dashoffset="-286"/>
    <circle cx="1010" cy="420" r="70" stroke="#C9D2E3" stroke-dasharray="66 440" stroke-dashoffset="-374"/>
  </g>
  <text x="1010" y="418" font-size="22" font-weight="800" text-anchor="middle" fill="#1B2A4A">6,240</text>
  <text x="1010" y="438" font-size="12" text-anchor="middle" class="muted">orders</text>

  <g font-size="14">
    <rect x="1108" y="352" width="12" height="12" rx="3" fill="#2F7D6D"/>
    <text x="1128" y="363" class="muted">Bakery</text><text x="1232" y="363" text-anchor="end" font-weight="700" fill="#1B2A4A">38%</text>
    <rect x="1108" y="386" width="12" height="12" rx="3" fill="#F2B544"/>
    <text x="1128" y="397" class="muted">Drinks</text><text x="1232" y="397" text-anchor="end" font-weight="700" fill="#1B2A4A">27%</text>
    <rect x="1108" y="420" width="12" height="12" rx="3" fill="#1B2A4A"/>
    <text x="1128" y="431" class="muted">Snacks</text><text x="1232" y="431" text-anchor="end" font-weight="700" fill="#1B2A4A">20%</text>
    <rect x="1108" y="454" width="12" height="12" rx="3" fill="#C9D2E3"/>
    <text x="1128" y="465" class="muted">Other</text><text x="1232" y="465" text-anchor="end" font-weight="700" fill="#1B2A4A">15%</text>
  </g>

